name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce analysis and audit release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Regenerate results from released derived scores
        run: make analyze

      - name: Fail if regenerated results differ from committed results
        run: git diff --exit-code -- papers/*/results

      - name: Verify release manifests and headline counts
        run: make verify

      - name: Release audit
        run: make release-audit

  paper:
    name: Build paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install tectonic
        # Third-party action, pinned to the v4.0.5 tag object.
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile both papers
        run: make papers

      - name: Stage arXiv submission bundle
        run: make arxiv

      # No byte-equality assertion here: PDF output is reproducible for a given
      # tectonic version and platform, but not across them. This job proves the
      # source compiles; the committed PDF's digest is recorded in the release
      # manifest by whoever builds the release.

      - uses: actions/upload-artifact@v4
        with:
          name: paper-and-arxiv-bundle
          path: |
            papers/*/paper/main.pdf
            build/arxiv/*.tar.gz
            build/arxiv/abstract.txt
